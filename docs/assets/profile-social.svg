<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="profile-social-title">
  <title id="profile-social-title">Ozgur Karahan. Models matter; what surrounds them decides whether agents get used: voice, distribution and context, crossed by identity and governance.</title>
