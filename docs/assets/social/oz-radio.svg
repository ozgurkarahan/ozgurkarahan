<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="ozr-social-title ozr-social-desc">
  <title id="ozr-social-title">Ozgur Karahan: Oz Radio, a presentation you can interrupt.</title>
  <desc id="ozr-social-desc">Ozgur Karahan, AI Solution Engineer at Microsoft. Headline "Oz Radio: a presentation you can interrupt" beside an illustrative drawing on a stone background: a presentation paused at slide 1 of 5 for a raised hand's question, answered from slides 2 and 3. Live demo · AI avatar · capped daily. ozgurkarahan.com</desc>
  <!-- Source of oz-radio-2026-10-20.png. Set in the self-hosted Public Sans (docs/assets/fonts/fonts.css); other fonts change the line widths. The nested drawing is docs/assets/work/oz-radio-cover.svg without its title and desc, at 0.75 scale. -->
  <rect width="1200" height="627" fill="#f6faf6"/>
  <rect x="64" y="116" width="1072" height="1" fill="#305b3b"/>
  <rect x="64" y="517" width="1072" height="1" fill="#c6d2c3"/>
