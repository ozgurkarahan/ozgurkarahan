    <text x="1137" y="86" fill="#485447" font-size="23" text-anchor="end">AI Solution Engineer at Microsoft</text>
  </g>
  <g font-family="'Public Sans', 'Segoe UI', Arial, sans-serif" fill="#202b21" font-size="68" font-weight="800" letter-spacing="-2.72">
