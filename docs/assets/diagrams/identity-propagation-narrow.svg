<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" role="img" aria-labelledby="idp-narrow-title" aria-describedby="idp-narrow-desc" focusable="false" font-family="Public Sans, Segoe UI, sans-serif">
  <title id="idp-narrow-title">Identity propagation: the same person reaches every system</title>
  <desc id="idp-narrow-desc">Diagram, read top to bottom. Alice signs in with Entra ID, in Teams or Copilot. A small circle, her identity token, travels along every arrow: down to the Foundry agent, which calls MCP tools with her token; to API Management, which validates the token and exchanges it on her behalf (on-behalf-of); then to Salesforce and to ServiceNow, side by side, which each apply their own rules. Both arrows end at the record, highlighted in amber, which names the person: &#8220;Last modified by Alice&#8221; in Salesforce and &#8220;Created by Alice&#8221; in ServiceNow.</desc>
  <rect width="600" height="1000" style="fill:var(--canvas,#f8f8fb)"/>
  <path d="M300 100V150M300 232V278M300 384V430M300 536V560M156 560H444M156 560V606M444 560V606M156 712V758M444 712V758" stroke-width="2" style="fill:none;stroke:var(--muted,#535568)"/>
  <path d="M294 150L300 160L306 150ZM294 278L300 288L306 278ZM294 430L300 440L306 430ZM150 606L156 616L162 606ZM438 606L444 616L450 606ZM150 758L156 768L162 758ZM438 758L444 768L450 758Z" style="fill:var(--muted,#535568)"/>
  <g stroke-width="2" style="fill:none;stroke:var(--ink,#191a2c)">
    <circle cx="300" cy="52" r="10"/>
    <path d="M282 86A18 18 0 0 1 318 86"/>
  </g>
  <text x="336" y="64" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Alice signs in</text>
  <text x="336" y="94" font-size="24" font-weight="500" style="fill:var(--muted,#535568)">with Entra ID</text>
  <rect x="24" y="160" width="552" height="72" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="300" y="206" text-anchor="middle" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Teams / Copilot</text>
  <rect x="24" y="288" width="552" height="96" rx="8" stroke-width="2" style="fill:var(--brand-soft,#eeeffe);stroke:var(--brand,#2f2a6b)"/>
  <text x="300" y="328" text-anchor="middle" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Foundry agent</text>
  <text x="300" y="362" text-anchor="middle" font-size="24" font-weight="500" style="fill:var(--muted,#535568)">calls MCP tools with her token</text>
  <rect x="24" y="440" width="552" height="96" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="300" y="480" text-anchor="middle" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">API Management</text>
  <text x="300" y="514" text-anchor="middle" font-size="24" font-weight="500" style="fill:var(--muted,#535568)">validates, exchanges on-behalf-of</text>
  <rect x="24" y="616" width="264" height="96" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="156" y="656" text-anchor="middle" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Salesforce</text>
  <text x="156" y="690" text-anchor="middle" font-size="24" font-weight="500" style="fill:var(--muted,#535568)">its own rules</text>
  <rect x="312" y="616" width="264" height="96" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="444" y="656" text-anchor="middle" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">ServiceNow</text>
  <text x="444" y="690" text-anchor="middle" font-size="24" font-weight="500" style="fill:var(--muted,#535568)">its own rules</text>
  <rect x="24" y="768" width="552" height="136" rx="8" stroke-width="4" style="fill:var(--accent-soft,#fef2dd);stroke:var(--accent,#b8791a)"/>
  <path d="M300 788V884" stroke-width="2" style="fill:none;stroke:var(--line,#d9dae4)"/>
  <text x="156" y="828" text-anchor="middle" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Last modified</text>
  <text x="156" y="862" text-anchor="middle" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">by Alice</text>
  <text x="444" y="828" text-anchor="middle" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Created</text>
  <text x="444" y="862" text-anchor="middle" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">by Alice</text>
  <g><circle cx="300" cy="126" r="7" style="fill:var(--brand-mid,#5e5cb3)"/><circle cx="300" cy="256" r="7" style="fill:var(--brand-mid,#5e5cb3)"/><circle cx="300" cy="408" r="7" style="fill:var(--brand-mid,#5e5cb3)"/><circle cx="156" cy="584" r="7" style="fill:var(--brand-mid,#5e5cb3)"/><circle cx="444" cy="584" r="7" style="fill:var(--brand-mid,#5e5cb3)"/><circle cx="156" cy="736" r="7" style="fill:var(--brand-mid,#5e5cb3)"/><circle cx="444" cy="736" r="7" style="fill:var(--brand-mid,#5e5cb3)"/></g>
  <text x="24" y="968" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" font-weight="400" style="fill:var(--muted,#535568)">Illustrative</text>
</svg>
