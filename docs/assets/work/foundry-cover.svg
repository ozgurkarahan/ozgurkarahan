  <path class="wk-draw" pathLength="1" d="M360 248H592V312H360Z" fill="none" stroke-width="4" stroke-miterlimit="1.5" style="stroke:var(--warm,#8a4b06);--t:3.3s;--d:0.65s"/>
  <path class="wk-draw" pathLength="1" d="M374 281l7 7 14-15" fill="none" stroke-width="4" style="stroke:var(--warm,#8a4b06);--t:3.88s;--d:0.4s"/>
  <text x="24" y="376" font-size="32" style="fill:var(--muted,#485447)">Illustrative</text>
</svg>
