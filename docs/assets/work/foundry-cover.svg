  <title id="foundry-cover-title">Foundry Hosted Agents: a coding agent runs in its own per-session sandbox, a computer per agent</title>
  <desc id="foundry-cover-desc">Illustrative drawing. On the left, the &#8220;Coding agent&#8221;; an arrow carries its request into a large frame, the point of the drawing, outlined in amber and labelled &#8220;Per-session sandbox&#8221;. Inside the frame are three tools of its own: &#8220;Workspace&#8221; with a folder, &#8220;Terminal&#8221; with a prompt, and &#8220;Browser check&#8221; with a browser window marked with a tick.</desc>
