  <title id="ozr-cover-title">Oz Radio: a live presentation paused for a spoken question</title>
  <desc id="ozr-cover-desc">Illustrative drawing: a live presentation paused for a question. A panel labelled "AI avatar" and "Slide 1 of 5" shows pause bars; below it is a strip of five slide thumbnails, with progress stopped partway through the first. A raised hand asks, in a speech bubble, "What is the difference between a model and an agent?". Slides 2 and 3 are highlighted and outlined, with an arrow down to the citation "From slides 2 and 3".</desc>
