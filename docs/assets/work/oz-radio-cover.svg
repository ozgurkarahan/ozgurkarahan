<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="ozr-cover-title" aria-describedby="ozr-cover-desc" focusable="false" font-family="Public Sans, Segoe UI, sans-serif">
  <title id="ozr-cover-title">Oz Radio: a live presentation pauses for a spoken question and answers from the slides it cites</title>
  <desc id="ozr-cover-desc">Illustrative drawing. A person at the top left asks a spoken question; an arrow leads down to the AI presenter, shown paused. An arrow runs from the presenter to a strip of five slides, numbered 1 to 5; slides 2 and 3 are highlighted as cited. An arrow from those two slides leads down to the point of the drawing, outlined in amber: &#8220;Answer: slides 2, 3&#8221;.</desc>
  <rect width="640" height="400" style="fill:var(--canvas,#f8f8fb)"/>
  <g stroke-width="2" style="fill:none;stroke:var(--ink,#191a2c)">
    <circle cx="128" cy="40" r="10"/>
    <path d="M110 74A18 18 0 0 1 146 74"/>
  </g>
  <text x="160" y="66" font-size="28" font-weight="500" style="fill:var(--muted,#535568)">Spoken question</text>
  <path d="M128 82V98M232 160H302M432 192V262" stroke-width="2" style="fill:none;stroke:var(--muted,#535568)"/>
  <path d="M122 98L128 108L134 98ZM302 154L312 160L302 166ZM426 262L432 272L438 262Z" style="fill:var(--muted,#535568)"/>
  <rect x="24" y="108" width="208" height="104" rx="8" stroke-width="2" style="fill:var(--brand-soft,#eeeffe);stroke:var(--brand,#2f2a6b)"/>
  <text x="128" y="150" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">AI presenter</text>
  <text x="96" y="194" font-size="28" font-weight="500" style="fill:var(--muted,#535568)">Paused</text>
  <text x="312" y="112" font-size="28" font-weight="500" style="fill:var(--muted,#535568)">Slides</text>
  <rect x="312" y="128" width="48" height="64" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <rect x="376" y="128" width="48" height="64" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <rect x="440" y="128" width="48" height="64" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <rect x="504" y="128" width="48" height="64" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <rect x="568" y="128" width="48" height="64" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <rect x="312" y="272" width="304" height="72" rx="8" stroke-width="2" style="fill:var(--accent-soft,#fef2dd);stroke:var(--line,#d9dae4)"/>
  <text x="464" y="318" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">Answer: slides 2, 3</text>
  <text x="24" y="380" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" font-weight="400" style="fill:var(--muted,#535568)">Illustrative</text>
  <path class="wk-stamp" d="M64 172h7v22h-7zM78 172h7v22h-7z" style="fill:var(--brand,#2f2a6b);--t:0.3s;--d:0.3s"/>
  <rect class="wk-fade" x="376" y="128" width="48" height="64" rx="8" stroke-width="2" style="fill:var(--brand-soft,#eeeffe);stroke:var(--brand,#2f2a6b);--t:0.8s;--d:0.3s"/>
  <rect class="wk-fade" x="440" y="128" width="48" height="64" rx="8" stroke-width="2" style="fill:var(--brand-soft,#eeeffe);stroke:var(--brand,#2f2a6b);--t:1.05s;--d:0.3s"/>
