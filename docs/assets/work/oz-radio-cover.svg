<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="ozr-cover-title ozr-cover-desc" focusable="false" font-family="Public Sans, Segoe UI, sans-serif">
  <title id="ozr-cover-title">Oz Radio: a live presentation paused for a spoken question</title>
  <desc id="ozr-cover-desc">Illustrative drawing: an AI avatar's presentation is paused at slide 1 of 5 while a raised hand asks "What is the difference between a model and an agent?", and the answer is marked as coming from slides 2 and 3.</desc>
  <rect x="24" y="24" width="272" height="180" stroke-width="2" style="fill:var(--sage-soft,#e1f0e1);stroke:var(--sage,#305b3b)"/>
  <text x="44" y="65" font-size="32" font-weight="700" style="fill:var(--ink,#202b21)">AI avatar</text>
  <path d="M230 86h14v56h-14zM258 86h14v56h-14z" style="fill:var(--sage,#305b3b)"/>
  <text x="44" y="179" font-size="32" style="fill:var(--muted,#485447)">Slide 1 of 5</text>
  <rect x="24" y="220" width="48" height="32" stroke-width="2" style="fill:var(--sage,#305b3b);stroke:var(--sage,#305b3b)"/>
