  <text x="324" y="65" font-size="32" font-weight="500" style="fill:var(--ink,#202b21)"><tspan x="324">What is the</tspan><tspan x="324" dy="38">difference</tspan><tspan x="324" dy="38">between a model</tspan><tspan x="324" dy="38">and an agent?</tspan></text>
