<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="platform-cover-title" aria-describedby="platform-cover-desc" focusable="false" font-family="Public Sans, Segoe UI, sans-serif">
  <title id="platform-cover-title">The Agentic Platform: experiences on top, agent computers and shared capabilities inside one governance</title>
  <desc id="platform-cover-desc">Illustrative drawing: three layers. On top, &#8220;Experiences&#8221;: three boxes (an IDE prompt, a chat bubble, an always-on sun), each with an arrow down into a frame. Inside the frame, &#8220;Every agent gets a computer&#8221;: two boxes (a laptop and a cloud), and &#8220;Shared capabilities&#8221;: four boxes (context, models, memory and tools glyphs). The frame around these two layers is outlined and ends in a tab labelled &#8220;One governance&#8221;.</desc>
