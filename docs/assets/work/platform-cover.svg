  <title id="platform-cover-title">The Agentic Platform: experiences on top, a computer per agent, one governance across them</title>
  <desc id="platform-cover-desc">Illustrative drawing. A top band, &#8220;Experiences&#8221; (chat, IDE, always-on), sends three arrows down to three &#8220;Agent&#8221; boxes, each with a computer of its own. A single frame encloses the three agents: the point of the drawing, outlined in amber and labelled &#8220;One governance&#8221;.</desc>
