<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="voice-cover-title" aria-describedby="voice-cover-desc" focusable="false" font-family="Public Sans, Segoe UI, sans-serif">
  <title id="voice-cover-title">Horizon Famille: a voice agent consults mock systems and stops for Teams approval</title>
  <desc id="voice-cover-desc">Illustrative drawing: on the left, a voice glyph (a microphone and a waveform, no face) stands for the voice agent. Right-angled routes lead from it to three dashed boxes, the mock systems &#8220;CRM&#8221;, &#8220;ERP&#8221; and &#8220;Knowledge base&#8221;; a small square token has visited each one, and each box is shaded as consulted. A fourth route, labelled &#8220;Outside its mandate&#8221; (in the recorded demo, a discount), runs down toward Teams and halts at a stop bar, where the token waits in front of the badge &#8220;Teams approval&#8221;: a person decides there.</desc>
  <rect width="640" height="400" style="fill:var(--canvas,#f6faf6)"/>
  <!-- BASE LAYER: complete meaning, never animated. -->
  <rect x="24" y="72" width="144" height="128" stroke-width="2" style="fill:var(--sage-soft,#e1f0e1);stroke:var(--sage,#305b3b)"/>
  <path d="M52 114a10 10 0 0 1 20 0v20a10 10 0 0 1-20 0z" style="fill:var(--sage,#305b3b)"/>
  <path d="M42 126v4a20 20 0 0 0 40 0v-4M62 150v14M50 166h24" stroke-width="4" style="fill:none;stroke:var(--sage,#305b3b)"/>
  <path d="M92 136H154" stroke-width="2" style="fill:none;stroke:var(--sage,#305b3b)"/>
  <path d="M168 136H236M250 56H236V368H282M236 136H250M236 216H250" stroke-width="2" style="fill:none;stroke:var(--muted,#485447)"/>
  <path d="M250 50l10 6-10 6zM250 130l10 6-10 6zM250 210l10 6-10 6z" style="fill:var(--muted,#485447)"/>
  <rect x="282" y="348" width="6" height="40" style="fill:var(--ink,#202b21)"/>
  <rect x="260" y="24" width="356" height="64" stroke-width="2" stroke-dasharray="8 6" style="fill:var(--surface,#ffffff);stroke:var(--sage,#305b3b)"/>
  <rect class="wk-fade" x="261" y="25" width="354" height="62" style="fill:var(--sage-soft,#e1f0e1);--t:1.5s;--d:0.35s"/>
  <text x="438" y="69" text-anchor="middle" font-size="36" font-weight="700" style="fill:var(--ink,#202b21)">CRM</text>
  <rect x="260" y="104" width="356" height="64" stroke-width="2" stroke-dasharray="8 6" style="fill:var(--surface,#ffffff);stroke:var(--sage,#305b3b)"/>
  <rect class="wk-fade" x="261" y="105" width="354" height="62" style="fill:var(--sage-soft,#e1f0e1);--t:2.2s;--d:0.35s"/>
  <text x="438" y="149" text-anchor="middle" font-size="36" font-weight="700" style="fill:var(--ink,#202b21)">ERP</text>
  <rect x="260" y="184" width="356" height="64" stroke-width="2" stroke-dasharray="8 6" style="fill:var(--surface,#ffffff);stroke:var(--sage,#305b3b)"/>
  <rect class="wk-fade" x="261" y="185" width="354" height="62" style="fill:var(--sage-soft,#e1f0e1);--t:2.8s;--d:0.35s"/>
