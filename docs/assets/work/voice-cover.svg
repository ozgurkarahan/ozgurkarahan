<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="voice-cover-title" aria-describedby="voice-cover-desc" focusable="false" font-family="Public Sans, Segoe UI, sans-serif">
  <title id="voice-cover-title">Horizon Famille: a phone call reaches a voice agent that checks mock systems and stops at a Teams approval</title>
  <desc id="voice-cover-desc">Illustrative drawing. A caller at the top left reaches the &#8220;Voice agent&#8221;. From the agent, right-angled arrows lead to three dashed boxes, the mock systems &#8220;CRM&#8221;, &#8220;ERP&#8221; and &#8220;Knowledge base&#8221;, each ticked as checked. A fourth arrow, labelled &#8220;Outside its mandate&#8221;, runs down and right to the point of the drawing, outlined in amber: &#8220;Teams approval&#8221;. A small circle, the request, waits in front of it: a person decides there.</desc>
  <rect width="640" height="400" style="fill:var(--canvas,#f8f8fb)"/>
  <g stroke-width="2" style="fill:none;stroke:var(--ink,#191a2c)">
    <circle cx="128" cy="40" r="10"/>
    <path d="M110 74A18 18 0 0 1 146 74"/>
  </g>
  <text x="160" y="66" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Caller</text>
  <path d="M128 82V98M232 144H302M272 72V216M272 72H302M272 216H302M48 180V320H302" stroke-width="2" style="fill:none;stroke:var(--muted,#535568)"/>
  <path d="M122 98L128 108L134 98ZM302 66L312 72L302 78ZM302 138L312 144L302 150ZM302 210L312 216L302 222ZM302 314L312 320L302 326Z" style="fill:var(--muted,#535568)"/>
  <rect x="24" y="108" width="208" height="72" rx="8" stroke-width="2" style="fill:var(--brand-soft,#eeeffe);stroke:var(--brand,#2f2a6b)"/>
  <text x="128" y="154" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">Voice agent</text>
  <rect x="312" y="44" width="304" height="56" rx="8" stroke-width="2" stroke-dasharray="8 6" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="368" y="82" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">CRM</text>
  <rect x="312" y="116" width="304" height="56" rx="8" stroke-width="2" stroke-dasharray="8 6" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="368" y="154" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">ERP</text>
  <rect x="312" y="188" width="304" height="56" rx="8" stroke-width="2" stroke-dasharray="8 6" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="368" y="226" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Knowledge base</text>
  <text x="64" y="276" font-size="28" font-weight="500" style="fill:var(--muted,#535568)">Outside its mandate</text>
  <rect x="312" y="288" width="304" height="64" rx="8" stroke-width="2" style="fill:var(--accent-soft,#fef2dd);stroke:var(--line,#d9dae4)"/>
  <text x="464" y="330" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">Teams approval</text>
  <text x="24" y="380" font-family="IBM Plex Mono, Consolas, monospace" font-size="22" font-weight="400" style="fill:var(--muted,#535568)">Illustrative</text>
  <path class="wk-draw" pathLength="1" d="M332 72l7 7 13-14" stroke-width="3" style="fill:none;stroke:var(--brand,#2f2a6b);--t:0.30s;--d:0.3s"/>
  <path class="wk-draw" pathLength="1" d="M332 144l7 7 13-14" stroke-width="3" style="fill:none;stroke:var(--brand,#2f2a6b);--t:0.55s;--d:0.3s"/>
  <path class="wk-draw" pathLength="1" d="M332 216l7 7 13-14" stroke-width="3" style="fill:none;stroke:var(--brand,#2f2a6b);--t:0.80s;--d:0.3s"/>
  <g class="wk-travel" style="--dy:-132px;--t:1.2s;--d:0.5s">
    <g class="wk-travel" style="--dx:-240px;--t:1.75s;--d:0.5s">
      <circle cx="288" cy="320" r="7" style="fill:var(--brand-mid,#5e5cb3)"/>
    </g>
  </g>
  <path class="wk-draw" pathLength="1" d="M320 288H608A8 8 0 0 1 616 296V344A8 8 0 0 1 608 352H320A8 8 0 0 1 312 344V296A8 8 0 0 1 320 288Z" stroke-width="4" style="fill:none;stroke:var(--accent,#b8791a);--t:2.4s;--d:0.8s"/>
</svg>
