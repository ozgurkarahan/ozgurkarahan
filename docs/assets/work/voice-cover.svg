  <text x="438" y="308" text-anchor="middle" font-size="32" font-weight="600" style="fill:var(--sage,#305b3b)">Outside its mandate</text>
  <rect x="304" y="344" width="312" height="48" style="fill:var(--warm-soft,#fbf0dc)"/>
  <!-- EMPHASIS LAYER: drawn over the base; only stroke-dashoffset / transform / opacity animate. -->
