<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="distribution-cover-title" aria-describedby="distribution-cover-desc" focusable="false" font-family="Public Sans, Segoe UI, sans-serif">
  <title id="distribution-cover-title">Customer 360: one agent, built once, published where people work</title>
  <desc id="distribution-cover-desc">Illustrative drawing. On the left, a single node, &#8220;One agent, built once&#8221;. A right-angled route splits in two and leads to &#8220;Teams&#8221; and to &#8220;Microsoft 365 Copilot&#8221;; a small circle, the user's request, sits on each branch. The point of the drawing, outlined in amber, is the frame around both surfaces, labelled &#8220;Where people work&#8221;.</desc>
