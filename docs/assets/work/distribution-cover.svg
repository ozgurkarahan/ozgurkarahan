  <rect x="32" y="146" width="200" height="112" rx="8" stroke-width="2" style="fill:var(--brand-soft,#eeeffe);stroke:var(--brand,#2f2a6b)"/>
  <text x="132" y="194" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">One agent</text>
  <text x="132" y="232" text-anchor="middle" font-size="26" font-weight="500" style="fill:var(--muted,#535568)">built once</text>
  <path d="M232 202H286M286 128V258M286 128H344M286 258H344" stroke-width="2" style="fill:none;stroke:var(--muted,#535568)"/>
  <path d="M344 122L354 128L344 134ZM344 252L354 258L344 264Z" style="fill:var(--muted,#535568)"/>
  <rect x="356" y="88" width="248" height="80" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="480" y="139" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">Teams</text>
  <rect x="356" y="200" width="248" height="116" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="480" y="250" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">Microsoft 365</text>
  <text x="480" y="288" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">Copilot</text>
  <text x="482" y="62" text-anchor="middle" font-size="26" font-weight="600" style="fill:var(--accent-text,#905c16)">Where people work</text>
  <text x="32" y="372" font-family="IBM Plex Mono, monospace" font-size="22" style="fill:var(--muted,#535568)">Illustrative</text>
