  <title id="sdlc-cover-title">Agentic software delivery: a pull request waits at the human review stop</title>
  <desc id="sdlc-cover-desc">Illustrative drawing: an &#8220;Issue&#8221; leads to &#8220;Plan approval&#8221;, a human stop marked passed with a check. Below it, a &#8220;Pull request&#8221; carries its &#8220;Required checks&#8221;, also marked with a check. A line runs from the pull request to the &#8220;Human review&#8221; stop, which shows a person outline; a small square, the pull request, waits just before it. Nothing is merged.</desc>
