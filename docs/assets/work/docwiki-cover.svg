  <path class="wk-draw" pathLength="1" d="M398 326l8 8 16-16" fill="none" stroke-width="3" stroke-linecap="butt" stroke-linejoin="round" style="stroke:var(--brand,#2f2a6b);--t:2.1s;--d:0.35s"/>
