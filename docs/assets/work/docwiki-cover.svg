<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="docwiki-cover-title" aria-describedby="docwiki-cover-desc" focusable="false" font-family="Public Sans, Segoe UI, sans-serif">
  <title id="docwiki-cover-title">DocWiki: a wiki claim traced to the line it cites</title>
  <desc id="docwiki-cover-desc">Illustrative drawing. On the left, a &#8220;Wiki page&#8221; with a highlighted &#8220;Claim&#8221; that carries footnote 1. An arrow runs from the footnote to the right, into a &#8220;Source, page 1&#8221;, where the point of the drawing, outlined in amber, is the &#8220;Cited line&#8221;. Below the source, a badge reads &#8220;Quote verified&#8221;.</desc>
