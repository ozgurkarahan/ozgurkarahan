  <title id="dw-cover-title">DocWiki: a claim traced to its cited source line</title>
  <desc id="dw-cover-desc">Illustrative drawing: the underlined wiki claim &#8220;Export above the limit by more than 1 MW for more than 5 minutes will be reported.&#8221; ends in footnote 1. An arrow runs from the footnote to page 1 of its source, where the cited line is outlined and labelled &#8220;p. 1 &#183; cited line&#8221;. A badge reads &#8220;&#10003; quote verified&#8221;.</desc>
