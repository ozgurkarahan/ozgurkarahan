  <rect x="24" y="32" width="268" height="248" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="48" y="80" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Wiki page</text>
  <rect x="48" y="104" width="196" height="10" rx="5" style="fill:var(--line,#d9dae4)"/>
  <rect x="48" y="134" width="220" height="60" rx="8" stroke-width="2" style="fill:var(--brand-soft,#eeeffe);stroke:var(--brand,#2f2a6b)"/>
  <text x="66" y="174" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Claim</text>
  <text x="206" y="174" font-family="IBM Plex Mono, monospace" font-size="26" font-weight="500" style="fill:var(--brand,#2f2a6b)">[1]</text>
  <rect x="48" y="214" width="176" height="10" rx="5" style="fill:var(--line,#d9dae4)"/>
  <rect x="48" y="240" width="140" height="10" rx="5" style="fill:var(--line,#d9dae4)"/>
  <rect x="348" y="32" width="268" height="248" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="372" y="80" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Source · p. 1</text>
  <rect x="372" y="104" width="190" height="10" rx="5" style="fill:var(--line,#d9dae4)"/>
  <rect x="368" y="134" width="228" height="60" rx="8" style="fill:var(--accent-soft,#fef2dd)"/>
  <text x="386" y="174" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Cited line</text>
  <rect x="372" y="214" width="200" height="10" rx="5" style="fill:var(--line,#d9dae4)"/>
  <rect x="372" y="240" width="150" height="10" rx="5" style="fill:var(--line,#d9dae4)"/>
  <path d="M268 164H350" stroke-width="2" style="fill:none;stroke:var(--muted,#535568)"/>
  <path d="M350 158L360 164L350 170Z" style="fill:var(--muted,#535568)"/>
  <rect x="348" y="300" width="268" height="52" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <path d="M398 326l8 8 16-16" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--brand,#2f2a6b)"/>
  <text x="436" y="336" font-size="26" font-weight="600" style="fill:var(--ink,#191a2c)">Quote verified</text>
  <text x="24" y="372" font-family="IBM Plex Mono, monospace" font-size="22" style="fill:var(--muted,#535568)">Illustrative</text>
  <g class="wk-travel" style="--dx:-56px;--t:0.3s;--d:0.7s">
    <circle cx="324" cy="164" r="7" style="fill:var(--brand-mid,#5e5cb3)"/>
