<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="identity-cover-title" aria-describedby="identity-cover-desc" focusable="false" font-family="Public Sans, Segoe UI, sans-serif">
  <title id="identity-cover-title">Agent access on behalf of the user: a gateway exchanges the user's token for one token per system</title>
  <desc id="identity-cover-desc">Illustrative drawing: a person outline (Alice, the fictional user of the public sample) points down to the &#8220;Agent&#8221;. An arrow leads from the Agent to the &#8220;Gateway&#8221; (Azure API Management), where her token stops: the gateway checks it and exchanges it on her behalf for one token per system. Two arrows leave the Gateway, each delivering a new token to a small square, the MCP server in front of &#8220;ServiceNow&#8221; and of &#8220;Salesforce&#8221;; both systems are outlined, each applying Alice&#8217;s own permissions. Below Salesforce, a badge reads &#8220;Last modified by Alice&#8221;. Bottom left: &#8220;Illustrative&#8221;.</desc>
