  <rect x="24" y="236" width="208" height="72" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="128" y="282" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">Gateway</text>
  <rect x="312" y="36" width="304" height="64" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
  <text x="464" y="78" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">ServiceNow</text>
  <rect x="312" y="132" width="304" height="64" rx="8" stroke-width="2" style="fill:var(--surface,#ffffff);stroke:var(--line,#d9dae4)"/>
