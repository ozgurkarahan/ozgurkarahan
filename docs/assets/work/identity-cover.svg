  <g stroke-width="2" style="fill:none;stroke:var(--ink,#191a2c)">
    <circle cx="128" cy="40" r="10"/>
    <path d="M110 74A18 18 0 0 1 146 74"/>
  </g>
  <text x="160" y="66" font-size="28" font-weight="600" style="fill:var(--ink,#191a2c)">Alice</text>
