  <text x="464" y="290" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">Last modified</text>
  <text x="464" y="326" text-anchor="middle" font-size="30" font-weight="600" style="fill:var(--ink,#191a2c)">by Alice</text>
