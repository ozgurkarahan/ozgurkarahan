<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="identity-cover-title" aria-describedby="identity-cover-desc" focusable="false" font-family="Public Sans, Segoe UI, sans-serif">
  <title id="identity-cover-title">Customer 360: one agent reaches ServiceNow and Salesforce through a gateway as the signed-in user</title>
  <desc id="identity-cover-desc">Illustrative drawing. Alice, the fictional signed-in user, sits at the top left; her token, a small circle, travels down through the &#8220;Agent&#8221; to the &#8220;Gateway&#8221;. From the gateway, right-angled arrows lead to &#8220;ServiceNow&#8221; and &#8220;Salesforce&#8221;, each reached with a token for Alice. An arrow from Salesforce leads down to the point of the drawing, outlined in amber: the record reads &#8220;Last modified by Alice&#8221;.</desc>
