# GitHub Pages (Jekyll) build settings.
# A custom exclude list replaces the defaults, so they are repeated here.
exclude:
  # Jekyll defaults
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # GitHub Pages default
  - CNAME
  # Repository-only documentation and tooling: not part of the website
  - AGENT.md
  - AGENTS.md
  - CLAUDE.md
  - DESIGN.md
  - PRODUCT.md
  - infra
  - scripts
