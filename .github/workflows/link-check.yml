name: Check Links

on:
  push:
    branches: [master]
    paths: ['**.md', 'index.html', 'customer-360/**', 'deckfm/**', 'oz-radio/**', 'privacy/**', 'identity-propagation/**', 'work/**']
  pull_request:
    paths: ['**.md', 'index.html', 'customer-360/**', 'deckfm/**', 'oz-radio/**', 'privacy/**', 'identity-propagation/**', 'work/**']
  schedule:
    - cron: '0 9 * * 1'  # Weekly on Monday at 09:00 UTC

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same-origin links are checked against the PR's own build in pages-build-check.yml,
      # so a link to a page added by the same PR does not fail on the live site.
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,301,302,429
            --exclude '^https://ozgurkarahan\.com/'
            --exclude '^https://img\.shields\.io/'
            --exclude '^https://cdn\.(jsdelivr\.net|simpleicons\.org)/'
            --exclude '^https://fonts\.(googleapis|gstatic)\.com/'
            --exclude '^https://www\.linkedin\.com/'
            '*.md'
            'docs/*.md'
            'index.html'
            'customer-360/index.html'
            'deckfm/index.html'
            'oz-radio/index.html'
            'privacy/index.html'
            'identity-propagation/index.html'
            'work/oz-radio/index.html'
          fail: true
